server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Serve static assets with long-lived cache
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Health / ping endpoint for uptime monitors
    location = /ping {
        add_header Content-Type application/json;
        return 200 '{"status":"pong","service":"frontend"}';
    }

    # SPA catch-all — forward every route to index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
